name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: python syntax
        run: python -m py_compile scripts/*.py examples/*.py
      - name: shell syntax + shellcheck (errors only)
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S error scripts/*.sh
      - name: engine.js syntax
        run: node --check templates/engine.js

  smoke:
    runs-on: ubuntu-latest   # Google Chrome is preinstalled on GitHub's Ubuntu runners (playwright channel='chrome')
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: commercial_qa on the starter template
        run: python scripts/commercial_qa.py templates/demo.html --lang en
      - name: render 30 frames + mix
        run: |
          mkdir -p out
          python scripts/render_parallel.py templates/demo.html out/smoke.mp4 --lang en --limit 30 --workers 2
          scripts/mix.sh out/smoke.mp4 - - - out/final.mp4 30 1
          test -s out/final.mp4
